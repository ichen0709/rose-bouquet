<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
 *  可調參數
 * ===================================================================== */
// phones (coarse pointer, or a narrow screen) get the lite build automatically; ?quality=high / ?quality=low force either one
const QUALITY_PARAM = new URLSearchParams(location.search).get('quality');
const LITE = QUALITY_PARAM === 'low' || (QUALITY_PARAM !== 'high' && (matchMedia('(pointer: coarse)').matches || innerWidth <= 820));
const T_START = performance.now();
// let the browser paint / handle touches between heavy build steps (rAF is paused in background tabs, hence the timer fallback)
const frame = () => new Promise(res => { let d = false; const f = () => { if (!d) { d = true; res(); } }; requestAnimationFrame(() => setTimeout(f, 0)); setTimeout(f, 80); });
const ROSE_COUNT = 20;      // 花朵數量（建議 15~25）
const MESH_DETAIL = LITE ? 14 : 28;     // 網格細分：最近幾朵玫瑰每片花瓣的縱向分段數（橫向約 0.86 倍）；遠處自動降到 60% / 35%
const HIGH_ROSES = LITE ? 3 : 6;       // 保留高細分的玫瑰數（離鏡頭最近的幾朵）
const SHADOW_ROSES = 6;     // 投射陰影的玫瑰數（只有中間主要幾朵）
const PETALS = 36;          // 每朵花瓣數上限（實際 86%~100%）
const CORE_PETALS = 4;      // 最內層緊包成花心的片數
const OPEN = 1.0;           // 全體開合倍率
const GAP = 0.005;          // 相鄰花瓣間的微小間隙
const KEY_INTENSITY = 1.75; // 主光強度
const ENV_INTENSITY = 1.3;  // RoomEnvironment 環境光強度
const TRANSMISSION = 0;     // 花瓣透光（0 = 關閉；設 0.1 左右會好看但明顯變慢）
const BABYS_BREATH_SPRIGS = LITE ? 42 : 90;  // 滿天星枝數（全部從花莖束長出，只分布在花朵之間與周圍）
const FADE_MS = 350;             // 換色漸變時間（玫瑰與滿天星共用同一個進度）
const EUCALYPTUS_STEMS = 16;     // 尤加利葉莖數
const EDGE_BUDS = 5;             // 最下排額外的含苞小玫瑰朵數（4~6），從紙口邊緣探出
const SIDE_SPRIGS = LITE ? 14 : 30;          // 沿紙口邊緣向外上方延伸的滿天星枝數
const PAPER_TEXT = 'You are my LOVE';   // 中層白紙上印的字
const RIBBON_TEXT = 'Happy everyday';   // 緞帶上的淡字
const PAPER_CREASE = 0.7;        // 皺褶強度（0 = 平滑，1 = 較皺；褶紋由頸部放射狀匯聚）
const PAPER_RIM_RADIUS = 4.5;    // 紙口半徑（中層）= 花頂圓弧最大半徑 4.3 的 1.05 倍；內層 -0.47、外層 +0.47（約 0.95 倍 / 1.15 倍）
const PAPER_TAIL = 0.20;         // 紙尾長度，占花束總高度的比例
const PAPER_THICK = 0.03;        // 紙的厚度（約 1.5 毫米）
const ROLL_SIZE = 0.18;          // 紙口翻邊（輕輕外捲一圈）的半徑
const BOW_SIZE = 1.0;            // 蝴蝶結大小（1.0 約為頸部寬度的 1.45 倍）
const RIBBON_WIDTH_RATIO = 0.5;  // 緞帶寬度 ÷ 蝴蝶結環高度
// （緞帶已改為零厚度的雙面曲面，不再有厚度參數）

// 包裝風格：inner/mid/outer 為三層紙顏色，tulle 為外層薄紗，ribbon 為緞帶；
// outerOp/tulleOp/ribbonOp 為透明度（ribbonOp 只作用在環與尾巴，結與窄帶永遠不透明），
// ribbonRough/ribbonSheen/ribbonSpec 為緞帶材質（緞面：粗糙度約 0.42、絲光 0.6、鏡面 0.6；深色緞帶再壓低；薄紗：0.6 / 0.3 / 0.5），
// ruffle = 1 時中層紙口有荷葉邊，text = 中層是否印字（ink 為字色），bg = 印刷底圖亮度，border = 淺色細邊
const WRAP_STYLES = {
  '奶油牛皮': { inner: '#C9AE8A', mid: '#F4F1EA', outer: '#EADBB8', tulle: '#FFF5E4', ribbon: '#EDE5D5', ink: 'rgba(120,100,82,0.62)',
                tulleOp: 0.45, outerOp: 1, ribbonOp: 1, ribbonRough: 0.3, ribbonSheen: 1, ribbonSpec: 0.85, sheer: 0, ruffle: 0, text: true, bg: 255, border: false },
  '霧黑':     { inner: '#3D3C41', mid: '#1E1D22', outer: '#101013', tulle: '#2B2931', ribbon: '#C9A24A', ink: '',
                tulleOp: 0.40, outerOp: 1, ribbonOp: 1, ribbonRough: 0.32, ribbonSheen: 0.85, ribbonSpec: 0.7, ribbonMetal: 0.2, sheer: 0, ruffle: 0, text: false, bg: 255, border: false },
  '粉荷葉':   { inner: '#F2D3D6', mid: '#EAB9C2', outer: '#F8DDE2', tulle: '#FCE6EB', ribbon: '#F2A6B6', ink: '',
                tulleOp: 0.40, outerOp: 0.55, ribbonOp: 0.78, ribbonRough: 0.55, ribbonSheen: 0.6, ribbonSpec: 0.4, sheer: 1, ruffle: 1, text: false, bg: 232, border: true },
  '銀灰紫':   { inner: '#8F8A9E', mid: '#E9E6EF', outer: '#B9B3C7', tulle: '#CFCADB', ribbon: '#7A1F3D', ink: 'rgba(150,148,172,0.6)',
                tulleOp: 0.28, outerOp: 0.5, ribbonOp: 1, ribbonRough: 0.3, ribbonSheen: 1, ribbonSpec: 0.85, sheer: 0, ruffle: 0, text: true, bg: 255, border: false },
};

// base 花瓣底部 / mid 主色 / rim 邊緣 / core 靠近花心的色調 / sheen 絲絨光澤 / coreDark 花心變暗程度（1 = 不變暗）
// breath 滿天星配色（切換花色時 0.4 秒漸變）
// roughness、env 可選：個別顏色覆寫材質粗糙度與環境光強度
const PALETTES = {
  '粉橘':   { base: '#8f2a22', mid: '#f0795a', rim: '#ffc8ae', core: '#b84a34', sheen: '#ffd9c8', coreDark: 0.65, breath: '#FBEDE4' },
  '正紅':   { base: '#2b0207', mid: '#a30a1d', rim: '#e8505f', core: '#4a050c', sheen: '#ff8a96', coreDark: 0.6, breath: '#F8E6E9' },
  '象牙杏': { base: '#D6AC84', mid: '#F0DCC0', rim: '#FAF0DF', core: '#E2BE98', sheen: '#FFF1DC', coreDark: 0.92, breath: '#FAF3E3' },
  '粉藍':   { base: '#6F8FB6', mid: '#A9C4DE', rim: '#D6E4F2', core: '#7F9FC4', sheen: '#E6F0FB', coreDark: 0.85, breath: '#E4EEF7' },
  '黑':     { base: '#17151C', mid: '#25232B', rim: '#3B3846', core: '#0F0E13', sheen: '#6A6485', coreDark: 0.85, breath: '#CFCADB',
              roughness: 0.4, env: 1.9 },
};

const rnd = (a = 0, b = 1) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const GOLDEN = 137.508 * Math.PI / 180;
const UP = new THREE.Vector3(0, 1, 0);
const Y_ROOT = -0.36;       // height where every petal root converges (just above the calyx)

/* ============ renderer / scene ============ */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, LITE ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = !LITE;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.5, 80);
camera.position.set(1.5, 2.2, innerWidth / innerHeight < 1 ? 32 : 22);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -2.6, 0);
controls.enableDamping = true;
controls.minDistance = 5;
controls.maxDistance = 45;
controls.autoRotate = true;           // slow turntable
controls.autoRotateSpeed = 0.7;
controls.maxPolarAngle = Math.PI * 0.8;
let interacting = false;
if (LITE) {
  controls.dampingFactor = 0.14;       // settles in a few frames instead of ~40: less work after the finger lifts
  controls.addEventListener('start', () => { interacting = true; });
  controls.addEventListener('end', () => { interacting = false; });
}

const key = new THREE.DirectionalLight(0xfff1e6, KEY_INTENSITY);
key.position.set(6, 10, 7);
key.castShadow = !LITE;
if (!LITE) key.shadow.mapSize.set(4096, 4096);
key.target.position.set(0, -3, 0);          // aim at the middle of the bouquet so the whole cone fits the shadow map
scene.add(key.target);
key.shadow.camera.left = -9.5; key.shadow.camera.right = 9.5;
key.shadow.camera.top = 9.5; key.shadow.camera.bottom = -9.5;
key.shadow.camera.near = 1; key.shadow.camera.far = 32;
key.shadow.bias = -0.0005;
key.shadow.normalBias = 0.02;
key.shadow.radius = 14;
scene.add(key);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8c8c0, 0.6));
const fill = new THREE.DirectionalLight(0xbcd2ff, 0.45);   // weak cool fill opposite the warm key
fill.position.set(-8, 4, -5);
scene.add(fill);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.2 }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = -7.2;
floor.receiveShadow = true;
scene.add(floor);
if (LITE) {
  // no shadow map on phones: a soft-edged round blob under the bouquet stands in for it
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d'), grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(70,52,46,0.24)'); grd.addColorStop(0.5, 'rgba(70,52,46,0.17)'); grd.addColorStop(1, 'rgba(70,52,46,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  floor.geometry.dispose();
  floor.geometry = new THREE.PlaneGeometry(13, 13);
  floor.material.dispose();
  floor.material = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false });
  floor.position.set(-1.3, -7.2, -1.6);              // cast away from the key light, like the real shadow
  floor.receiveShadow = false;
}

const bouquet = new THREE.Group();     // everything of the bouquet; swayed by the wind about the grip
scene.add(bouquet);

/* =====================================================================
 *  單朵玫瑰：花瓣配方 + 網格（同一配方可在不同細分下重建，LOD 外觀一致）
 * ===================================================================== */
function widthProfile(u) {
  // narrow claw at the base, widest in the upper-middle, tip closes to 0 as a half-ellipse
  const body = 0.24 + 0.76 * smooth(0, 0.62, u);
  const s = smooth(0.62, 1, u);
  return body * Math.sqrt(Math.max(0, 1 - s * s));
}

function makeVeinTexture() {
  const W = 256, H = 512;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const img = g.createImageData(W, H);
  const f = [];
  for (let n = 0; n < 6; n++) f.push({ k: rnd(18, 70), p: rnd(0, 6.28), a: rnd(0.4, 1) });
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const xs = x / W, ys = y / H;
    let v = 0;
    for (const o of f) v += o.a * Math.sin(xs * o.k + o.p + Math.sin(ys * 3 + o.p) * 0.8);
    v = v / 6 * 0.5 + 0.5;
    v = v * 0.75 + Math.random() * 0.08 + (1 - ys) * 0.1;
    const b = Math.max(0, Math.min(255, v * 255));
    const q = (y * W + x) * 4;
    img.data[q] = img.data[q + 1] = img.data[q + 2] = b; img.data[q + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  return tex;
}

// every random choice is made once here, so geometry rebuilt at another detail level looks identical
function makeRoseRecipe(open, nPetals) {
  const P = nPetals;
  const roll = rnd(0, Math.PI * 2);
  const cand = [P - 1, P - 2, P - 3].sort(() => Math.random() - 0.5);
  const wideOnes = new Set([cand[0]]);
  if (Math.random() < 0.6) wideOnes.add(cand[1]);

  const petals = [];
  for (let i = 0; i < P; i++) {
    const t = i / (P - 1);
    const te = clamp01((i - CORE_PETALS * 0.5) / (P - 1 - CORE_PETALS * 0.5));
    const e = te * te * (3 - 2 * te);                    // eased opening 0 (tight) -> 1 (open)
    const outerK = Math.max(0, i - (P - 4)) / 3;         // last three petals hang down
    const wide = wideOnes.has(i) ? 1 : 0;
    const sizeJ = rnd(0.9, 1.1), tiltJ = rnd(-8, 8) * Math.PI / 180, rollJ = rnd(-6, 6) * Math.PI / 180;
    const bendJ = rnd(0.85, 1.15);
    const L = (0.34 + 0.80 * Math.pow(t, 0.9)) * sizeJ * (1 - 0.15 * outerK);
    const y0 = 0.18 - 0.55 * Math.pow(t, 0.9);
    const yStart = Math.min(y0, Y_ROOT);
    petals.push({
      t, e, outerK, L,
      root: y0 - yStart, yStart,                        // root extends the petal down to the calyx
      hs: (1.85 - 1.0 * t) * rnd(0.95, 1.05),
      alpha0: Math.max(0.02, (3 + 66 * Math.pow(e, 1.15) + 14 * outerK + 16 * wide) * Math.PI / 180 + tiltJ * (0.3 + e)),
      curl: ((0.12 + 0.9 * e) + 0.8 * outerK) * open * bendJ,
      lip: (0.35 + 2.0 * e + 0.5 * wide) * open * bendJ,
      r0: 0.04 + 0.12 * Math.pow(t, 1.1) + GAP * i,
      phi: i * GOLDEN + roll + rollJ,
      spiralAmp: 0.04 * (1 - smooth(0, 0.6, t)),
      rippleAmp: 0.02 + 0.045 * e + 0.02 * outerK,
      asym: rnd(-0.12, 0.12) + (outerK > 0 ? rnd(-0.1, 0.1) : 0),
      skew: rnd(-0.04, 0.04), twist: rnd(-0.22, 0.22),
      waveF: rnd(2.0, 3.6), waveP: rnd(0, 6.28), waveF2: rnd(4.5, 6.5), waveP2: rnd(0, 6.28),
      tint: rnd(0.96, 1.04), hue: rnd(-0.012, 0.012),
    });
  }
  const sepalAz = rnd(0, 6.28);
  return { petals, sepalAz };
}

const PROFILE_STEPS = 96;

// attributes every merged part must share
function addAttrs(g, { t = -3, color = null } = {}) {
  const n = g.attributes.position.count;
  const col = new Float32Array(n * 3);
  if (color) for (let i = 0; i < n; i++) { col[i * 3] = color.r; col[i * 3 + 1] = color.g; col[i * 3 + 2] = color.b; }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setAttribute('colorB', new THREE.BufferAttribute(col.slice(), 3));   // fade target colour
  g.setAttribute('aU', new THREE.BufferAttribute(new Float32Array(n), 1));
  g.setAttribute('aV', new THREE.BufferAttribute(new Float32Array(n), 1));
  g.setAttribute('aT', new THREE.BufferAttribute(new Float32Array(n).fill(t), 1));
  g.setAttribute('aMisc', new THREE.BufferAttribute(new Float32Array(n * 2), 2));
  return g;
}

function petalGeometry(p, NU, NV) {
  const M = (NU + 1) * (NV + 1);
  const id = (k, j) => k * (NV + 1) + j;
  const Ltot = p.L + p.root;

  // meridian profile over the whole length (root + visible petal); tilt grows smoothly from vertical at the root
  const rr = new Float32Array(PROFILE_STEPS + 1), yy = new Float32Array(PROFILE_STEPS + 1);
  rr[0] = p.r0; yy[0] = p.yStart;
  for (let k = 1; k <= PROFILE_STEPS; k++) {
    const s = (k - 0.5) / PROFILE_STEPS * Ltot;
    const uL = clamp01((s - p.root) / p.L);
    const lip = smooth(0.8, 1, uL);
    const a = p.alpha0 * (p.root > 1e-4 ? smooth(0, p.root, s) : 1) + p.curl * Math.pow(uL, 1.5) + p.lip * lip * lip * (3 - 2 * lip);
    rr[k] = rr[k - 1] + Math.sin(a) * Ltot / PROFILE_STEPS;
    yy[k] = yy[k - 1] + Math.cos(a) * Ltot / PROFILE_STEPS;
  }
  const prof = (u) => {
    const x = clamp01(u) * PROFILE_STEPS;
    const k0 = Math.min(Math.floor(x), PROFILE_STEPS - 1), f = x - k0;
    return [lerp(rr[k0], rr[k0 + 1], f), lerp(yy[k0], yy[k0 + 1], f)];
  };

  const pos = new Float32Array(M * 3);
  const uA = new Float32Array(M), vA = new Float32Array(M), uv = new Float32Array(M * 4);
  for (let k = 0; k <= NU; k++) {
    const x = k / NU;
    const up = 1 - Math.pow(1 - x, 1.5);               // denser rows toward the rolled tip
    const s = up * Ltot;
    const uL = clamp01((s - p.root) / p.L);
    const wf = Math.max(0.0015, s < p.root ? lerp(0.1, 0.24, smooth(0, p.root, s)) : widthProfile(uL));
    const amp = p.rippleAmp * uL * uL;
    for (let j = 0; j <= NV; j++) {
      const v = -1 + 2 * j / NV;
      let [r, y] = prof(up);
      const ripple = Math.sin(v * p.waveF * Math.PI + p.waveP) * 0.7 + Math.sin(v * p.waveF2 * Math.PI + p.waveP2) * 0.3;
      r += 0.12 * p.L * v * v * uL * uL * (0.3 + p.e)
        - 0.05 * (1 - smooth(0, 0.45, p.t)) * v * v * uL
        + (0.5 + 0.5 * v) * p.spiralAmp * (0.4 + 0.6 * uL)
        + amp * ripple
        + p.twist * 0.08 * v * uL;
      y += 0.05 * p.L * v * v * uL + amp * 0.7 * Math.sin(v * p.waveF * Math.PI + p.waveP + 1.3) + p.skew * v * uL * uL;
      const psi = p.phi + v * p.hs * wf * (1 + p.asym * v) + p.twist * uL * uL * 0.35;
      const q = id(k, j);
      pos[q * 3] = r * Math.cos(psi); pos[q * 3 + 1] = y; pos[q * 3 + 2] = r * Math.sin(psi);
      uA[q] = uL; vA[q] = Math.abs(v);
      uv[q * 2] = v * 0.5 + 0.5; uv[q * 2 + 1] = up;
      uv[(M + q) * 2] = v * 0.5 + 0.5; uv[(M + q) * 2 + 1] = up;
    }
  }

  const tri = [];
  for (let k = 0; k < NU; k++) for (let j = 0; j < NV; j++) {
    const a = id(k, j), b = id(k + 1, j), c = id(k + 1, j + 1), d = id(k, j + 1);
    tri.push(a, b, c, a, c, d);
  }
  const tmp = new THREE.BufferGeometry();
  tmp.setAttribute('position', new THREE.BufferAttribute(pos.slice(0, M * 3), 3));
  tmp.setIndex(tri);
  tmp.computeVertexNormals();
  const nrm = tmp.attributes.normal.array;
  let sgn = 0;
  for (let n = 0; n < M; n++) sgn += nrm[n * 3] * pos[n * 3] + nrm[n * 3 + 2] * pos[n * 3 + 2];
  sgn = sgn >= 0 ? 1 : -1;
  tmp.dispose();

  const all = new Float32Array(M * 6);
  all.set(pos, 0);
  for (let q = 0; q < M; q++) {
    const th = (0.004 + 0.013 * (1 - uA[q]) * (1 - vA[q] * vA[q])) * (0.7 + 0.5 * p.t) * sgn;   // thick base, thin rim
    for (let c = 0; c < 3; c++) all[(M + q) * 3 + c] = pos[q * 3 + c] + nrm[q * 3 + c] * th;
  }

  const idx = [];
  for (let n = 0; n < tri.length; n += 3) {
    idx.push(tri[n], tri[n + 2], tri[n + 1]);
    idx.push(M + tri[n], M + tri[n + 1], M + tri[n + 2]);
  }
  const strip = (a0, a1) => idx.push(a0, a1, M + a1, a0, M + a1, M + a0);
  for (let k = 0; k < NU; k++) { strip(id(k, 0), id(k + 1, 0)); strip(id(k, NV), id(k + 1, NV)); }
  for (let j = 0; j < NV; j++) strip(id(NU, j), id(NU, j + 1));

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(all, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  addAttrs(g, { t: p.t });
  const aU = g.attributes.aU.array, aV = g.attributes.aV.array, aM = g.attributes.aMisc.array;
  for (let q = 0; q < M; q++) {
    for (const off of [0, M]) {
      aU[q + off] = uA[q]; aV[q + off] = vA[q];
      aM[(q + off) * 2] = p.tint; aM[(q + off) * 2 + 1] = p.hue;
    }
  }
  return g;
}

const SEPAL_GREEN = new THREE.Color('#4a7a3c');
const GREEN_DARK = new THREE.Color('#2d5428');

// dark calyx cup under the petals: fills the hollow in the middle (coloured like the core, darker)
function cupGeometry() {
  const pts = [[0.001, -0.44], [0.10, -0.42], [0.20, -0.37], [0.30, -0.28], [0.36, -0.15], [0.38, 0.0], [0.37, 0.08]]
    .map(([r, y]) => new THREE.Vector2(r, y));
  return addAttrs(new THREE.LatheGeometry(pts, 28), { t: -2 });
}

// small receptacle hidden below the outermost petals
function hipGeometry() {
  const g = new THREE.SphereGeometry(0.13, 12, 8);
  g.scale(1, 0.85, 1);
  g.translate(0, -0.52, 0);
  return addAttrs(g, { t: -3, color: GREEN_DARK });
}

// slender leaf-like sepal hugging the underside of the bloom, drooping outward and down
function sepalGeometry(az) {
  const nu = 10, nv = 4;
  const pos = [], uv = [], idx = [];
  const ex = [Math.cos(az), Math.sin(az)];
  for (let k = 0; k <= nu; k++) {
    const s = k / nu;
    const r = 0.17 + 0.62 * s;
    const y = -0.42 - 0.50 * s * s;
    const w = 0.085 * Math.sin(Math.PI * Math.pow(s, 0.7));
    for (let j = 0; j <= nv; j++) {
      const a = -1 + 2 * j / nv;
      const fold = Math.abs(a) * w * 0.6;
      pos.push(ex[0] * r - ex[1] * a * w, y + fold, ex[1] * r + ex[0] * a * w);
      uv.push(j / nv, s);
    }
  }
  for (let k = 0; k < nu; k++) for (let j = 0; j < nv; j++) {
    const a = k * (nv + 1) + j, b = (k + 1) * (nv + 1) + j, c = b + 1, d = a + 1;
    idx.push(a, b, c, a, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return addAttrs(g, { t: -3, color: SEPAL_GREEN });
}

function buildRoseGeometry(recipe, NU, NV) {
  const parts = recipe.petals.map(p => petalGeometry(p, NU, NV));
  parts.push(cupGeometry(), hipGeometry());
  for (let k = 0; k < 5; k++) parts.push(sepalGeometry(recipe.sepalAz + k * Math.PI * 2 / 5 + rnd(-0.12, 0.12)));
  const g = mergeGeometries(parts, false);     // one geometry = one draw call per rose
  parts.forEach(x => x.dispose());
  return g;
}

/* ============ colouring: vertex colours act as soft AO (dark base / inside -> light rim) ============ */
const cBase = new THREE.Color(), cMid = new THREE.Color(), cRim = new THREE.Color(), cCore = new THREE.Color(), cTmp = new THREE.Color();

// writes the target colour (colorB); with `both` the shown colour (color) is set too
function recolorGeometry(geo, pal, vr, both = false) {
  const tone = (hex, c) => { c.set(hex); if (vr) c.offsetHSL(vr.dh, vr.ds, vr.dl); return c; };
  tone(pal.base, cBase); tone(pal.mid, cMid); tone(pal.rim, cRim); tone(pal.core, cCore);
  const A = geo.attributes;
  const aU = A.aU.array, aV = A.aV.array, aT = A.aT.array, aM = A.aMisc.array, col = A.colorB.array, colA = A.color.array;
  for (let q = 0, n = aT.length; q < n; q++) {
    const t = aT[q];
    if (t < -2.5) continue;                                   // sepals / receptacle keep their green
    if (t < -1.5) {
      cTmp.copy(cCore).multiplyScalar(0.5);                   // calyx cup: core colour, darker
    } else {
      const u = aU[q], va = aV[q];
      cTmp.copy(cBase).lerp(cMid, smooth(0, 0.55, u)).lerp(cRim, smooth(0.6, 1, u) * (0.55 + 0.45 * va));
      cTmp.lerp(cCore, 0.75 * Math.pow(1 - t, 1.3));
      const dark = lerp(pal.coreDark, 1, Math.pow(t, 0.6));
      const ao = lerp(0.82, 1, smooth(0, 0.65, u));
      const vein = 0.97 + 0.03 * Math.cos((va * 9) / (0.35 + 0.65 * u) * Math.PI);
      cTmp.multiplyScalar(dark * ao * vein * aM[q * 2] * (1 + 0.03 * Math.sin(q * 12.9898)));
      cTmp.r *= 1 + aM[q * 2 + 1]; cTmp.b *= 1 - aM[q * 2 + 1];
    }
    col[q * 3] = cTmp.r; col[q * 3 + 1] = cTmp.g; col[q * 3 + 2] = cTmp.b;
    if (both) { colA[q * 3] = cTmp.r; colA[q * 3 + 1] = cTmp.g; colA[q * 3 + 2] = cTmp.b; }
  }
  A.colorB.needsUpdate = true;
  if (both) A.color.needsUpdate = true;
}

// freeze what is currently shown (mix m between color and colorB) as the new start colour
function bakeGeometry(geo, m) {
  const a = geo.attributes.color.array, b = geo.attributes.colorB.array;
  for (let i = 0; i < a.length; i++) a[i] += (b[i] - a[i]) * m;
  geo.attributes.color.needsUpdate = true;
}

/* ============ shared petal material ============ */
const mixUniform = { value: 1 };   // 0 = old colour, 1 = new colour; driven by the single fade below
const petalMaterial = new THREE.MeshPhysicalMaterial({
  vertexColors: true,
  side: THREE.DoubleSide,
  roughness: 0.55,
  metalness: 0,
  sheen: 1,
  sheenRoughness: 0.6,
  sheenColor: new THREE.Color('#ffffff'),
  transmission: TRANSMISSION,
  thickness: 0.04,
  ior: 1.35,
  bumpMap: makeVeinTexture(),
  bumpScale: 0.8,
  envMapIntensity: ENV_INTENSITY,
  polygonOffset: true,
  polygonOffsetFactor: 1,
  polygonOffsetUnits: 1,
});
petalMaterial.onBeforeCompile = (shader) => {
  shader.uniforms.uMix = mixUniform;
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', '#include <common>\nattribute vec3 colorB;\nuniform float uMix;')
    .replace('#include <color_vertex>', 'vColor = mix(color, colorB, uMix);');
};

/* =====================================================================
 *  花束
 * ===================================================================== */
let currentPal = PALETTES['粉橘'];
const DOME_C = new THREE.Vector3(0, -3.2, 0);   // centre of the dome the blossoms sit on
const DOME_R = 4.7;
const TH_MAX = 0.98;                            // dome half-angle (rad)
const GRIP = new THREE.Vector3(0, -5.4, 0);     // every stem converges here
const detailOf = (level) => {
  const nu = [MESH_DETAIL, Math.round(MESH_DETAIL * 0.6), Math.round(MESH_DETAIL * 0.35)][level];
  const NU = Math.max(level === 2 ? 6 : LITE ? 8 : 10, nu);
  return [NU, Math.max(level === 2 ? 5 : LITE ? 7 : 8, Math.round(NU * 0.86))];
};

class Rose {
  constructor(spec) {
    Object.assign(this, spec);
    this.recipe = makeRoseRecipe(spec.open, spec.petals);
    this.geos = [null, null, null];
    this.level = -1;
    this.mesh = new THREE.Mesh(undefined, petalMaterial);
    this.mesh.position.copy(spec.origin);
    this.mesh.quaternion.setFromUnitVectors(UP, spec.axis);
    this.mesh.scale.setScalar(spec.scale);
    this.mesh.castShadow = spec.index < SHADOW_ROSES;
    this.mesh.receiveShadow = true;
    this.mesh.userData.cat = 'rose';
    bouquet.add(this.mesh);
  }
  setLevel(l) {
    if (l === this.level) return;
    if (!this.geos[l]) {
      const [nu, nv] = detailOf(l);
      this.geos[l] = buildRoseGeometry(this.recipe, nu, nv);
      recolorGeometry(this.geos[l], currentPal, this.variant, true);
    }
    if (!LITE && this.level === 0 && this.geos[0]) { this.geos[0].dispose(); this.geos[0] = null; }   // free the heavy mesh when it leaves the front
    this.mesh.geometry = this.geos[l];
    this.level = l;
  }
  // start a colour fade: the colour shown right now becomes the start, the new palette the target
  retarget(m, instant) {
    for (const g of this.geos) {
      if (!g) continue;
      if (instant) recolorGeometry(g, currentPal, this.variant, true);
      else { bakeGeometry(g, m); recolorGeometry(g, currentPal, this.variant, false); }
    }
  }
}

/* =====================================================================
 *  包裝紙的剖面（放在這裡，因為排花時要用它來確保最下排玫瑰不穿進紙壁）
 *  座標：頸部（緞帶綁點）在 y = NECK_Y；h = 頸部以上的高度（紙尾為負）。花束的「後側」朝 -z，「前側」朝 +z，隨整束旋轉。
 * ===================================================================== */
const FLOWER_R = 4.3;                                           // radius of the blossom arc: the reference for the paper mouth
const NECK_Y = -5.0;                                            // the ribbon ties the paper here
const TOP_Y = 2.2;                                              // top of the blossoms
const NECK_R = 0.72;                                            // radius of the gathered neck (mid layer)
const TAIL_LEN = PAPER_TAIL * (TOP_Y - NECK_Y) / (1 - PAPER_TAIL);   // tail = PAPER_TAIL of the whole bouquet height
const RIM_FRONT_Y = -0.8, RIM_BACK_Y = 0.3;                     // front rim: centre height of the lowest blossoms; back rim: middle of the dome
const H_FRONT = RIM_FRONT_Y - NECK_Y, H_BACK = RIM_BACK_Y - NECK_Y;
const RIM_GAP = 0.47;                                           // inner / outer rim radius = middle rim -/+ this (room for each layer's rolled edge)
const HEIGHT_MID = 0, HEIGHT_INNER = -0.35, HEIGHT_OUTER = -1.6;   // the printed middle paper stands tallest, the outer one lowest
const THETA_BACK = -Math.PI / 2;
const wrapAngle = (a) => Math.atan2(Math.sin(a), Math.cos(a));
const OUTER_N = 5, OUTER_HW = 52 * Math.PI / 180, OUTER_TH0 = 0.9;   // the outer paper sheets (the ribbon follows their pleats)

function vnoise(x, y) {
  const h = (a, b) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  return lerp(lerp(h(ix, iy), h(ix + 1, iy), sx), lerp(h(ix, iy + 1), h(ix + 1, iy + 1), sx), sy) * 2 - 1;
}

// tulip cup: a slim gathered neck, a belly, then an almost vertical wall at the rim (<= ~20 deg at the front, a few degrees at the back)
function trumpetR(h) {
  if (h < 0) { const t = clamp01(-h / TAIL_LEN); return NECK_R + 0.12 * t * t; }       // the tail flares slightly at its end
  if (h >= H_FRONT) return PAPER_RIM_RADIUS + 0.06 * (h - H_FRONT);
  const w = h / H_FRONT, S = w * w * (3 - 2 * w);
  return NECK_R + (PAPER_RIM_RADIUS - NECK_R) * Math.pow(S, 0.75);
}
// layers keep their distance: 0.16 near the neck, RIM_GAP at the rim
const layerOff = (sign, h) => sign * (0.16 + (RIM_GAP - 0.16) * smooth(0.25, 1, clamp01(h / H_FRONT)));
// radial pleats: large at the neck, small at the rim, converging toward the neck because the phase depends on angle only
const foldA = (h) => PAPER_CREASE * (0.14 * Math.exp(-Math.max(h, 0) / 1.6) + 0.035) * (h < 0 ? 0.8 : 1);
const foldAt = (th, h) => foldA(h) * (0.7 * Math.sin(7 * th + 0.4) + 0.3 * Math.sin(15 * th + 1.1))
  + PAPER_CREASE * 0.03 * vnoise(Math.cos(th) * 2 + h * 0.4, Math.sin(th) * 2 - h * 0.3);
const lift = (u) => 0.08 * smooth(0.75, 1, u) - 0.03 * smooth(0.25, 0, u);      // shingled sheet edges
// rim height around the circumference: tall at the back, low at the front, 2-3 gentle highs and lows on top
const rimH = (th, ph) => lerp(H_FRONT, H_BACK, Math.pow(0.5 + 0.5 * Math.cos(th - THETA_BACK), 1.2))
  + 0.12 * Math.sin(3 * th + ph) + 0.07 * Math.sin(2 * th + 2 * ph);
// largest radius of the outermost paper at height y, pleat peaks and edge lift included (no clearance added)
const surfMax = (y) => { const h = y - NECK_Y; return trumpetR(h) + layerOff(1, h) + foldA(h) + PAPER_CREASE * 0.03 + 0.08; };

function layoutRoses() {
  const N = ROSE_COUNT;
  const items = [];
  const buds = new Set(), full = new Set();
  const pool = Array.from({ length: N - 1 }, (_, i) => i + 1).sort(() => Math.random() - 0.5);
  pool.slice(0, Math.max(2, Math.round(N * 0.15))).forEach(i => buds.add(i));
  pool.slice(Math.max(2, Math.round(N * 0.15)), Math.max(2, Math.round(N * 0.15)) + Math.round(N * 0.2)).forEach(i => full.add(i));

  for (let i = 0; i < N; i++) {
    const th = Math.acos(1 - (1 - Math.cos(TH_MAX)) * (i + 0.5) / N);
    const az = i * GOLDEN;
    const dir = new THREE.Vector3(Math.sin(th) * Math.cos(az), Math.cos(th), Math.sin(th) * Math.sin(az));
    let scale = lerp(0.82, 0.58, th / TH_MAX) * rnd(0.92, 1.08);
    let open = rnd(0.75, 1.05);
    if (buds.has(i)) { open = rnd(0.4, 0.55); scale *= 0.82; }
    if (full.has(i)) { open = rnd(1.15, 1.3); scale *= 1.05; }
    items.push({ index: i, dir, scale, open, petals: Math.round((buds.has(i) ? 0.84 : 1) * PETALS * rnd(0.88, 1)) });
  }
  // relax overlaps along the dome so blossoms are packed tightly without interpenetrating
  for (let it = 0; it < 80; it++) {
    for (let a = 0; a < N; a++) for (let b = a + 1; b < N; b++) {
      const A = items[a], B = items[b];
      const pa = A.dir.clone().multiplyScalar(DOME_R), pb = B.dir.clone().multiplyScalar(DOME_R);
      const d = pa.distanceTo(pb), minD = (A.scale + B.scale) * 1.2 * 0.82;
      if (d < minD && d > 1e-4) {
        const push = pa.sub(pb).multiplyScalar((minD - d) / d * 0.25 / DOME_R);
        A.dir.add(push).normalize(); B.dir.sub(push).normalize();
      }
    }
    for (const A of items) {                                      // keep inside the dome cap
      const th = Math.acos(A.dir.y);
      if (th > TH_MAX * 1.04) {
        const h = Math.hypot(A.dir.x, A.dir.z), k = Math.sin(TH_MAX * 1.04) / h;
        A.dir.set(A.dir.x * k, Math.cos(TH_MAX * 1.04), A.dir.z * k);
      }
    }
  }
  for (const A of items) {
    A.origin = DOME_C.clone().addScaledVector(A.dir, DOME_R);
    A.axis = A.dir.clone().add(new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).multiplyScalar(0.1)).normalize();
  }
  // small bud-like roses on the lowest row, peeking out over the paper rim and covering the gaps
  for (let k = 0; k < EDGE_BUDS; k++) {
    let best = null, bestScore = -1;
    for (let c = 0; c < 60; c++) {
      const th = rnd(1.08, 1.2), az = rnd(0, Math.PI * 2);
      const dir = new THREE.Vector3(Math.sin(th) * Math.cos(az), Math.cos(th), Math.sin(th) * Math.sin(az));
      const origin = DOME_C.clone().addScaledVector(dir, DOME_R - 0.1);
      const scale = rnd(0.42, 0.52);
      let score = 1e9;
      for (const it of items) score = Math.min(score, origin.distanceTo(it.origin) / ((it.scale + scale) * 1.15));
      if (score > bestScore) { bestScore = score; best = { dir, origin, scale }; }
    }
    items.push({
      index: items.length, dir: best.dir, scale: best.scale, open: rnd(0.4, 0.5), petals: 26,
      origin: best.origin,
      axis: new THREE.Vector3(best.dir.x, best.dir.y * 0.6, best.dir.z).normalize(),
    });
  }
  // the lowest blossoms must not poke through the paper wall: pull them toward the axis, and shrink them a little if that is not enough
  for (const it of items) it.scale0 = it.scale;
  for (let pass = 0; pass < 60; pass++) {
    for (let a = 0; a < items.length; a++) for (let b = a + 1; b < items.length; b++) {
      const A = items[a], B = items[b];
      const dx = A.origin.x - B.origin.x, dy = A.origin.y - B.origin.y, dz = A.origin.z - B.origin.z;
      const d = Math.hypot(dx, dy, dz), minD = (A.scale + B.scale) * 1.2 * 0.8, d2 = Math.hypot(dx, dz);
      if (d < minD && d2 > 1e-4) {                                  // keep neighbours from piling up (horizontal push only)
        const k = (minD - d) * 0.25 / d2;
        A.origin.x += dx * k; A.origin.z += dz * k; B.origin.x -= dx * k; B.origin.z -= dz * k;
      }
    }
    for (const it of items) {
      const o = it.origin, hc = o.y - NECK_Y, ang = Math.atan2(o.z, o.x), reach = 1.2 * it.scale;
      const rim = rimH(ang, 0.4) + HEIGHT_INNER;                    // rim of the innermost paper at this side
      if (hc - reach * 0.7 >= rim) continue;                         // clearly above the paper
      const hw = Math.min(hc, rim);
      const lim = trumpetR(hw) + layerOff(-1, hw) - 0.12 - reach;    // wall radius of the inner paper, minus clearance and the blossom's own reach
      const rho = Math.hypot(o.x, o.z);
      if (rho > lim && lim > 0.4) {
        it.scale = Math.max(it.scale0 * 0.8, it.scale * 0.985);
        const k = lim / rho; o.x *= k; o.z *= k;
      }
    }
  }
  // 2–3 blossoms get a slightly different tone
  const variants = [{ dh: 0, ds: 0.05, dl: -0.07 }, { dh: 0, ds: -0.04, dl: 0.06 }, { dh: rnd(0, 1) < 0.5 ? 0.025 : -0.025, ds: 0, dl: 0 }];
  const vcount = 2 + Math.round(Math.random());
  const order = items.map((_, i) => i).sort(() => Math.random() - 0.5);
  for (let k = 0; k < vcount; k++) items[order[k]].variant = variants[k];
  return items;
}

const roses = layoutRoses().map(spec => new Rose(spec));
await frame();

/* ---------- stems with thorns (one merged mesh) ---------- */
const stemMaterial = new THREE.MeshStandardMaterial({ color: '#3b6a33', roughness: 0.6 });
{
  const parts = [];
  for (const r of roses) {
    const base = r.origin.clone().addScaledVector(r.axis, -0.55 * r.scale);
    const bend = new THREE.Vector3(rnd(-1, 1), 0, rnd(-1, 1)).multiplyScalar(0.35);
    const c1 = base.clone().addScaledVector(r.axis, -1.4).add(bend);
    const c2 = GRIP.clone().add(new THREE.Vector3(rnd(-0.5, 0.5), 1.8, rnd(-0.5, 0.5)));
    const end = GRIP.clone().add(new THREE.Vector3(rnd(-0.1, 0.1), 0, rnd(-0.1, 0.1)));
    const curve = new THREE.CubicBezierCurve3(base, c1, c2, end);
    r.stemCurve = curve;
    parts.push(new THREE.TubeGeometry(curve, 36, 0.045, 6, false));
    for (let k = 0; k < 4; k++) {                                   // thin thorns
      const t = rnd(0.15, 0.7);
      const p = curve.getPoint(t), tg = curve.getTangent(t);
      const out = new THREE.Vector3(rnd(-1, 1), rnd(-0.2, 0.6), rnd(-1, 1)).normalize();
      out.addScaledVector(tg, -out.dot(tg)).normalize();
      const cone = new THREE.ConeGeometry(0.016, 0.09, 4);
      cone.translate(0, 0.045, 0);
      cone.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(UP, out));
      cone.translate(p.x, p.y, p.z);
      parts.push(cone);
    }
  }
  const mesh = new THREE.Mesh(mergeGeometries(parts, false), stemMaterial);
  parts.forEach(g => g.dispose());
  mesh.castShadow = true;
  mesh.userData.cat = 'stems';
  bouquet.add(mesh);
}

/* ---------- paper-fit: filler (baby's breath, eucalyptus) must stay inside the paper wall ---------- */
const FIT_MARGIN = 0.06;                         // 3 mm (1 unit is about 5 cm)
const fitStats = { gyp: null, euc: null };
// radius of the innermost paper surface present at this point (bouquet frame), or Infinity above the tallest rim (nothing to pierce there)
function paperInnerR(x, y, z) {
  const h = y - NECK_Y, th = Math.atan2(z, x);
  const rimMid = rimH(th, 1.2) + HEIGHT_MID + FIT_MARGIN;       // the tallest layer sets the mouth
  if (h >= rimMid) return Infinity;
  const rimIn = rimH(th, 0.4) + HEIGHT_INNER;
  const off = h < rimIn ? layerOff(-1, h) : 0;                  // above the inner paper the mid paper is the innermost wall
  return trumpetR(h) + off + foldAt(th, h) - 0.03;              // -0.03: the lowest shingled edge (lift)
}
// a point (+ its own radius e) pierces the paper if it is closer than the margin to the inner wall, or beyond it
const pierces = (p, e) => Math.hypot(p.x, p.z) + e > paperInnerR(p.x, p.y, p.z) - FIT_MARGIN;
const _fa = new THREE.Vector3(), _fb = new THREE.Vector3();
// move every point of a branch: scale about its start (shorter), then tilt it toward the vertical about its start (inward)
function branchMover(start, f, phi, dir) {
  const axis = new THREE.Vector3().crossVectors(new THREE.Vector3(dir.x, 0, dir.z), UP).normalize();
  const q = new THREE.Quaternion().setFromAxisAngle(axis, phi);
  return (p) => p.clone().sub(start).multiplyScalar(f).applyQuaternion(q).add(start);
}
// try: full length, then shortened down to 40%; if that is not enough, tilt inward step by step (again trying lengths); else give up
function fitBranch(start, end, test) {
  const dir = end.clone().sub(start);
  for (const phi of [0, 0.12, 0.25, 0.4, 0.6, 0.85]) {
    if (phi > 0 && Math.hypot(dir.x, dir.z) < 1e-3) break;
    for (let f = 1; f >= 0.4 - 1e-9; f -= 0.05) {
      const mover = branchMover(start, f, phi, dir);
      if (test(mover)) return { mover, mode: phi > 0 ? 'tilted' : f < 1 - 1e-9 ? 'shortened' : 'ok' };
    }
  }
  return null;
}

/* ---------- filler: baby's breath (InstancedMesh blossoms on fine forked twigs) ---------- */
await frame();
let flowerMesh = null;
const flowerJitter = [];
const insideRose = (p, k) => roses.some(r => p.distanceTo(r.origin) < r.scale * 1.15 * k);
{
  // flowers and twig tips live only in a shell around the blossom surface: no tufts floating outside, nothing below the blooms
  const inBand = (p, cap = 1.15) => {
    const d = p.clone().sub(DOME_C), r = d.length();
    if (r < DOME_R - 0.7 || r > DOME_R + 0.55) return false;          // at most ~10% beyond the outermost blossom edge
    return Math.acos(d.y / r) <= cap;                                 // inside the cap, never below it
  };
  const twigParts = [];
  const flowers = [];
  const gypStat = fitStats.gyp = { sprigs: 0, buds: 0, badSprigs: 0, badBuds: 0, shortened: 0, tilted: 0, ok: 0, removed: 0, budsLost: 0, keptBuds: 0, afterBad: 0 };
  let cur = null;                                                    // the sprig under construction: nothing is committed before it fits the paper
  const twig = (a, b, radius) => cur.twigs.push({ a, b, radius });
  const cluster = (c, n, cap = 1.15) => {
    for (let i = 0; i < n; i++) {
      const p = c.clone().add(new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).multiplyScalar(0.06));
      if (inBand(p, cap) && !insideRose(p, 0.8)) cur.flowers.push({ p, r: rnd(0.02, 0.042) });
    }
  };
  const makeSprig = (o) => {
    // every sprig starts ON the stem bundle just above the grip and climbs through the gaps between the roses
    const rose = roses[Math.floor(Math.random() * roses.length)];
    const start = rose.stemCurve.getPoint(rnd(0.72, 0.95));
    let end = null;
    for (let tries = 0; tries < 40 && !end; tries++) {
      const th = rnd(o.thLo, o.thHi), az = rnd(0, Math.PI * 2), R = DOME_R + rnd(o.rLo, o.rHi);
      const e = DOME_C.clone().add(new THREE.Vector3(Math.sin(th) * Math.cos(az), Math.cos(th), Math.sin(th) * Math.sin(az)).multiplyScalar(R));
      if (inBand(e, o.cap) && !insideRose(e, 0.8)) end = e;
    }
    if (!end) return;
    const mid = start.clone().lerp(end, 0.5).add(new THREE.Vector3(rnd(-0.25, 0.25), 0, rnd(-0.25, 0.25)));
    const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
    cur = { start, mid, end, twigs: [], flowers: [] };
    for (let k = 0; k < 5; k++) {
      let p = null;
      for (let tries = 0; tries < 8 && !p; tries++) { const c = curve.getPoint(rnd(0.75, 0.98)); if (inBand(c, o.cap)) p = c; }
      if (!p) continue;
      const radial = p.clone().sub(DOME_C).normalize();
      let q = null;
      for (let tries = 0; tries < 12 && !q; tries++) {
        const d = radial.clone().multiplyScalar(o.radial).add(new THREE.Vector3(rnd(-1, 1), rnd(-0.4, 1), rnd(-1, 1)).multiplyScalar(0.6)).normalize();
        const c = p.clone().addScaledVector(d, rnd(0.3, 0.7));
        if (inBand(c, o.cap) && !insideRose(c, 0.8)) q = c;
      }
      if (!q) continue;
      twig(p, q, 0.005);
      for (let m = 0; m < 3; m++) {
        const sub = q.clone().addScaledVector(new THREE.Vector3(rnd(-1, 1), rnd(-0.2, 1), rnd(-1, 1)).normalize(), rnd(0.12, 0.3));
        if (!inBand(sub, o.cap)) continue;
        twig(q, sub, 0.004);
        cluster(sub, 5, o.cap);
      }
      cluster(q, 4, o.cap);
    }
    cluster(end, 6, o.cap);
    const rec = cur; cur = null;
    // ---- fit to the paper: every sample of the main stem, both ends of every twig (and the middle), and every bud with its radius
    const samples = (mv) => {
      const c = new THREE.QuadraticBezierCurve3(mv(rec.start), mv(rec.mid), mv(rec.end)), out = [{ p: null, e: 0.007, c }];
      out.length = 0;
      for (let k = 0; k <= 14; k++) out.push({ p: c.getPoint(k / 14), e: 0.007 });
      for (const t of rec.twigs) { const a = mv(t.a), b = mv(t.b); out.push({ p: a, e: t.radius }, { p: b, e: t.radius }, { p: a.clone().lerp(b, 0.5), e: t.radius }); }
      for (const f of rec.flowers) out.push({ p: mv(f.p), e: f.r, bud: true });
      return out;
    };
    const ident = (q) => q;
    const bad = samples(ident).filter(x => pierces(x.p, x.e));
    gypStat.sprigs++; gypStat.buds += rec.flowers.length;
    if (bad.length) { gypStat.badSprigs++; gypStat.badBuds += bad.filter(x => x.bud).length; }
    let mover = ident, mode = 'ok';
    if (bad.length) {
      const fit = fitBranch(rec.start, rec.end, (mv) => !samples(mv).some(x => pierces(x.p, x.e)));
      if (!fit) { gypStat.removed++; gypStat.budsLost += rec.flowers.length; return; }
      mover = fit.mover; mode = fit.mode;
      gypStat[mode]++;
    }
    const curveF = new THREE.QuadraticBezierCurve3(mover(rec.start), mover(rec.mid), mover(rec.end));
    twigParts.push(new THREE.TubeGeometry(curveF, 14, 0.007, 3, false));   // continuous thin stem back to the bundle
    for (const t of rec.twigs) twigParts.push(new THREE.TubeGeometry(new THREE.LineCurve3(mover(t.a), mover(t.b)), 2, t.radius, 3, false));
    for (const f of rec.flowers) flowers.push({ p: mover(f.p), r: f.r });
    gypStat.keptBuds += rec.flowers.length;
    // re-check what was committed (must be clean)
    if (samples(mover).some(x => pierces(x.p, x.e))) gypStat.afterBad++;
  };
  for (let s = 0; s < BABYS_BREATH_SPRIGS; s++) makeSprig({ thLo: 0.12, thHi: 1.1, rLo: -0.35, rHi: 0.3, cap: 1.15, radial: 0.6 });
  // from the side: along the paper rim, up and outward, hugging the outline of the bouquet
  for (let s = 0; s < SIDE_SPRIGS; s++) makeSprig({ thLo: 1.0, thHi: 1.2, rLo: -0.1, rHi: 0.45, cap: 1.25, radial: 0.9 });
  const twigMesh = new THREE.Mesh(mergeGeometries(twigParts, false), new THREE.MeshStandardMaterial({ color: '#6f8f5d', roughness: 0.7 }));
  twigParts.forEach(g => g.dispose());
  twigMesh.userData.cat = 'gypsophila';
  bouquet.add(twigMesh);

  const fm = new THREE.InstancedMesh(LITE ? new THREE.SphereGeometry(1, 5, 3) : new THREE.IcosahedronGeometry(1, 1),
    new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.55, emissive: '#2a2a2e' }), flowers.length);
  const m4 = new THREE.Matrix4();
  flowers.forEach((f, i) => {
    m4.compose(f.p, new THREE.Quaternion(), new THREE.Vector3(f.r, f.r, f.r));
    fm.setMatrixAt(i, m4);
    flowerJitter[i] = 1 + rnd(-0.06, 0.06);          // each bud ±6% lighter / darker than the base colour
    fm.setColorAt(i, new THREE.Color(1, 1, 1));
  });
  fm.userData.cat = 'gypsophila';
  bouquet.add(fm);
  flowerMesh = fm;
}

/* ---------- filler: eucalyptus (round grey-green leaves alternating along thin stems) ---------- */
await frame();
{
  const stems = [];
  const leafGeo = new THREE.CircleGeometry(1, LITE ? 9 : 18);
  {
    const p = leafGeo.attributes.position;
    for (let i = 0; i < p.count; i++) p.setZ(i, 0.35 * (p.getX(i) ** 2 + p.getY(i) ** 2));   // slightly cupped
    leafGeo.computeVertexNormals();
  }
  const mats = [];
  const eucStat = fitStats.euc = { stems: 0, leaves: 0, badStems: 0, badLeaves: 0, shortened: 0, tilted: 0, ok: 0, removed: 0, leavesLost: 0, afterBad: 0 };
  // a stem + its leaves from the four control points; leaf looks come from fixed random numbers so a shortened stem keeps the same leaves
  const buildEuca = (st, mv) => {
    const curve = new THREE.CubicBezierCurve3(mv(st.start), mv(st.c1), mv(st.c2), mv(st.end));
    const leaves = [];
    const n = st.leafRnd.length;
    for (let k = 0; k < n; k++) {
      const t = lerp(0.4, 0.99, k / (n - 1));
      const P = curve.getPoint(t), T = curve.getTangent(t);
      const ref = Math.abs(T.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : UP;
      const side = new THREE.Vector3().crossVectors(T, ref).normalize();
      side.applyAxisAngle(T, k * 1.9 + st.leafRnd[k][0]);        // alternate around the stem
      const size = lerp(0.24, 0.15, t) * st.leafRnd[k][1];
      const ex = side.clone().multiplyScalar(Math.cos(0.5)).addScaledVector(T, Math.sin(0.5)).normalize();
      const ez = new THREE.Vector3().crossVectors(ex, T).normalize();
      const ey = new THREE.Vector3().crossVectors(ez, ex).normalize();
      const c = P.clone().addScaledVector(ex, size * 0.95);
      leaves.push({ c, ex, ey, ez, size });
    }
    return { curve, leaves };
  };
  const eucPoints = (b) => {
    const out = [];
    for (let k = 0; k <= 24; k++) out.push({ p: b.curve.getPoint(k / 24), e: 0.012 });
    b.leaves.forEach((l, li) => {
      out.push({ p: l.c, e: 0, leaf: li });
      for (const [a, sgn] of [[l.ex, 1], [l.ex, -1], [l.ey, 1], [l.ey, -1]]) out.push({ p: l.c.clone().addScaledVector(a, sgn * l.size), e: 0, leaf: li });
    });
    return out;
  };
  for (let s = 0; s < EUCALYPTUS_STEMS; s++) {
    // start inside the bouquet, point outward and clearly upward (never closer to horizontal than ~45°)
    const th = rnd(0.3, 0.8), az = (s / EUCALYPTUS_STEMS) * Math.PI * 2 + rnd(-0.2, 0.2);
    const dirS = new THREE.Vector3(Math.sin(th) * Math.cos(az), Math.cos(th), Math.sin(th) * Math.sin(az));
    const R = DOME_R + rnd(0.3, 1.5);
    const end = DOME_C.clone().addScaledVector(dirS, R);
    const start = DOME_C.clone().addScaledVector(dirS, DOME_R - rnd(2.2, 2.7));
    const c1 = start.clone().lerp(end, 0.35).add(new THREE.Vector3(rnd(-0.2, 0.2), 0.2, rnd(-0.2, 0.2)));
    const c2 = start.clone().lerp(end, 0.7).add(new THREE.Vector3(rnd(-0.2, 0.2), 0.25, rnd(-0.2, 0.2)));
    const nLeaves = 12 + Math.floor(Math.random() * 4);
    const leafRnd = [];
    for (let k = 0; k < nLeaves; k++) leafRnd.push([rnd(-0.3, 0.3), rnd(0.85, 1.15)]);
    const st = { start, c1, c2, end, leafRnd };
    const ident = (q) => q;
    const badPts = eucPoints(buildEuca(st, ident)).filter(x => pierces(x.p, x.e));
    eucStat.stems++; eucStat.leaves += nLeaves;
    let mover = ident;
    if (badPts.length) {
      eucStat.badStems++; eucStat.badLeaves += new Set(badPts.filter(x => x.leaf !== undefined).map(x => x.leaf)).size;
      const fit = fitBranch(start, end, (mv) => !eucPoints(buildEuca(st, mv)).some(x => pierces(x.p, x.e)));
      if (!fit) { eucStat.removed++; eucStat.leavesLost += nLeaves; continue; }
      mover = fit.mover; eucStat[fit.mode]++;
    }
    const built = buildEuca(st, mover);
    if (eucPoints(built).some(x => pierces(x.p, x.e))) eucStat.afterBad++;
    stems.push(new THREE.TubeGeometry(built.curve, 24, 0.012, 4, false));
    for (const l of built.leaves) {
      const m = new THREE.Matrix4().makeBasis(l.ex.clone().multiplyScalar(l.size), l.ey.clone().multiplyScalar(l.size), l.ez.clone().multiplyScalar(l.size));
      m.setPosition(l.c);
      mats.push(m);
    }
  }
  const stemMesh = new THREE.Mesh(mergeGeometries(stems, false), new THREE.MeshStandardMaterial({ color: '#7c9483', roughness: 0.6 }));
  stems.forEach(g => g.dispose());
  stemMesh.userData.cat = 'eucalyptus';
  bouquet.add(stemMesh);

  const lm = new THREE.InstancedMesh(leafGeo,
    new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.6, side: THREE.DoubleSide }), mats.length);
  const col = new THREE.Color();
  mats.forEach((m, i) => { lm.setMatrixAt(i, m); lm.setColorAt(i, col.setHSL(rnd(0.33, 0.4), rnd(0.12, 0.22), rnd(0.55, 0.68))); });
  lm.castShadow = false;
  lm.userData.cat = 'eucalyptus';
  bouquet.add(lm);
}

/* =====================================================================
 *  包裝（重寫）：多張獨立的大張紙（三層）+ 薄紗裙襬 + 單一蝴蝶結（剖面函數見上方 trumpetR / layerOff / rimH）
 * ===================================================================== */
const timeU = { value: 0 };       // drives the ribbon-tail breeze in the shader
const ruffleU = { value: 0 };     // 0..1: frilled rim of the middle paper (pink style)

/* ---------- one big sheet: high-density surface, rolled rim, rounded corners, Laplacian-smoothed ---------- */
const ROWS_TAIL = LITE ? 8 : 14, ROWS_BODY = LITE ? 28 : 50, COLS = LITE ? 32 : 48;      // 65 x 49 vertices per sheet
function makeSheet(sign, center, hw, idx, o) {
  const rows = ROWS_TAIL + ROWS_BODY + 1, cols = COLS + 1, M = rows * cols;
  const P = new Float32Array(M * 3), UV = new Float32Array(M * 4), RUF = new Float32Array(M * 6);
  const rollJ = rnd(0.85, 1.0), botJ = 1 + rnd(0, 0.03);
  const Rbase = (th, h, u) => trumpetR(h) + layerOff(sign, h) + (idx % 2) * 0.02 + foldAt(th, h) + lift(u);
  for (let j = 0; j < cols; j++) {
    const u = j / COLS, th = center + (u - 0.5) * 2 * hw;
    const du = Math.min(u, 1 - u);
    const drop = du < 0.18 ? 0.6 * (1 - Math.sqrt(1 - ((0.18 - du) / 0.18) ** 2)) : 0;   // rounded corners, radius >= 18% of the sheet width
    const hTop = rimH(th, o.rimPh) + o.hOff - drop;
    const h0 = hTop * 0.85;                                                                // the last 15% rolls over
    for (let i = 0; i < rows; i++) {
      const h = i <= ROWS_TAIL ? -TAIL_LEN * botJ * (1 - i / ROWS_TAIL) : hTop * (i - ROWS_TAIL) / ROWS_BODY;
      let R, y;
      if (h > h0) {
        const rollK = smooth(0.02, 0.3, du);                                              // the roll fades out toward the rounded corners: no horns
        const s = (h - h0) / (hTop - h0), alpha = Math.PI * 0.92 * s * rollK, rho = ROLL_SIZE * rollJ;
        const R0 = Rbase(th, h0, u), dR = (Rbase(th, h0 + 0.05, u) - Rbase(th, h0 - 0.05, u)) / 0.1;
        const n = Math.hypot(dR, 1), Tx = dR / n, Ty = 1 / n, Nx = 1 / n, Ny = -dR / n;   // tangent and outward-down normal: C1-smooth roll
        R = R0 + rho * (Math.sin(alpha) * Tx + (1 - Math.cos(alpha)) * Nx);
        y = NECK_Y + h0 + rho * (Math.sin(alpha) * Ty + (1 - Math.cos(alpha)) * Ny);
      } else { R = Rbase(th, h, u); y = NECK_Y + h; }
      const q = i * cols + j, cx = Math.cos(th), sz = Math.sin(th);
      P[q * 3] = R * cx; P[q * 3 + 1] = y; P[q * 3 + 2] = R * sz;
      UV[q * 2] = 1 - u; UV[q * 2 + 1] = i / (rows - 1);          // u runs against theta so the print reads correctly from outside
      const z = i > ROWS_TAIL ? smooth(0.85, 1, (i - ROWS_TAIL) / ROWS_BODY) : 0;       // frilled rim offset (pink style)
      const w1 = Math.sin(14 * th + o.rimPh), w2 = Math.sin(14 * th + o.rimPh + 1);
      RUF[q * 3] = cx * 0.22 * w1 * z; RUF[q * 3 + 1] = 0.28 * w2 * z; RUF[q * 3 + 2] = sz * 0.22 * w1 * z;
    }
  }
  // 4 passes of Laplacian smoothing; the neck row, the tail's bottom row and the outline stay fixed
  const tmp = new Float32Array(P.length);
  for (let pass = 0; pass < 4; pass++) {
    tmp.set(P);
    for (let i = 1; i < rows - 1; i++) {
      if (i === ROWS_TAIL) continue;
      for (let j = 1; j < cols - 1; j++) for (let c = 0; c < 3; c++) {
        const a = (i * cols + j) * 3 + c;
        const avg = (tmp[a - 3] + tmp[a + 3] + tmp[a - cols * 3] + tmp[a + cols * 3]) / 4;
        P[a] = tmp[a] + 0.45 * (avg - tmp[a]);
      }
    }
  }
  const tri = [];
  for (let i = 0; i < rows - 1; i++) for (let j = 0; j < cols - 1; j++) {
    const a = i * cols + j, b = (i + 1) * cols + j, c = b + 1, d = a + 1;
    tri.push(a, b, c, a, c, d);
  }
  // second skin = thickness (~1.5 mm), offset along the smoothed normals, pointing away from the axis
  const g0 = new THREE.BufferGeometry();
  g0.setAttribute('position', new THREE.BufferAttribute(P, 3));
  g0.setIndex(tri);
  g0.computeVertexNormals();
  const nrm = g0.attributes.normal.array;
  g0.dispose();
  let sg = 0;
  for (let q = 0; q < M; q += 7) sg += nrm[q * 3] * P[q * 3] + nrm[q * 3 + 2] * P[q * 3 + 2];
  sg = sg >= 0 ? 1 : -1;
  const pos = new Float32Array(M * 6), uv = new Float32Array(M * 4), ruf = new Float32Array(M * 6);
  pos.set(P, 0); uv.set(UV.subarray(0, M * 2), 0); uv.set(UV.subarray(0, M * 2), M * 2); ruf.set(RUF.subarray(0, M * 3), 0); ruf.set(RUF.subarray(0, M * 3), M * 3);
  for (let q = 0; q < M; q++) for (let c = 0; c < 3; c++) pos[(M + q) * 3 + c] = P[q * 3 + c] + nrm[q * 3 + c] * PAPER_THICK * sg;
  const idx2 = [];
  for (let n = 0; n < tri.length; n += 3) {
    idx2.push(tri[n], tri[n + 1], tri[n + 2]);
    idx2.push(M + tri[n], M + tri[n + 2], M + tri[n + 1]);
  }
  const edge = (a, b) => idx2.push(a, b, M + b, a, M + b, M + a);
  for (let j = 0; j < cols - 1; j++) { edge(j, j + 1); edge((rows - 1) * cols + j, (rows - 1) * cols + j + 1); }
  for (let i = 0; i < rows - 1; i++) { edge(i * cols, (i + 1) * cols); edge(i * cols + cols - 1, (i + 1) * cols + cols - 1); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv.subarray(0, M * 4), 2));
  g.setAttribute('ruf', new THREE.BufferAttribute(ruf.subarray(0, M * 6), 3));
  g.setIndex(idx2);
  g.computeVertexNormals();                              // smooth shading, never flat
  return g;
}

/* ---------- tulle skirt: wide frilled ring gathered at the neck, reaching ~2/3 up the paper; its outer edge never exceeds the paper mouth ---------- */
function tulleGeometry(nT = LITE ? 112 : 160, nS = LITE ? 32 : 48) {
  const cols = nT + 1, rows = nS + 1;
  const pos = new Float32Array(rows * cols * 3), uv = new Float32Array(rows * cols * 2);
  const cap = PAPER_RIM_RADIUS + RIM_GAP - 0.02;                // outer paper mouth radius
  for (let i = 0; i < rows; i++) {
    const w = i / nS;
    for (let j = 0; j < cols; j++) {
      const th = j / nT * Math.PI * 2;
      const hLo = 0.85 + 0.1 * Math.sin(7 * th + 1);
      // reaches ~2/3 up the paper, but never above the outer paper layer (above it the skirt would stand away from the wall)
      const hHi = Math.min((2 / 3) * rimH(th, 2.1), rimH(th, 2.0) + HEIGHT_OUTER - 0.5) + 0.12 * Math.sin(11 * th + 0.6) + 0.05 * Math.sin(17 * th);   // soft scalloped edge
      const h = lerp(hLo, hHi, w);
      const frill = 0.1 * Math.exp(-h / 1.3) * Math.sin(11 * th) + 0.04 * Math.sin(13 * th + 1) * smooth(0.5, 1, w);   // displacement <= 0.14
      const R = Math.min(trumpetR(h) + layerOff(1, h) + foldA(h) + 0.2 + frill, cap);
      const q = i * cols + j;
      pos[q * 3] = R * Math.cos(th); pos[q * 3 + 1] = NECK_Y + h; pos[q * 3 + 2] = R * Math.sin(th);
      uv[q * 2] = j / nT; uv[q * 2 + 1] = w;
    }
  }
  const idx = [];

const BAND_GAP = 0.03;      // the narrow band sits ~1.5 mm above the paper (1 unit is about 5 cm); 1 mm let pleat peaks between mesh samples poke through

// outermost paper surface at azimuth th (x = R cos th, z = R sin th) and height h above the neck; follows the pleats of the outer sheets
function outerSurfaceR(th, h) {

    if (Math.abs(d) > OUTER_HW) continue;

const rotAxis = new THREE.Vector3();
// rotation-minimizing (parallel transport) frames along a polyline: the side vector never flips or twists by itself.
// With endSide given, the leftover twist at the end is spread evenly along the curve (closed curves).
function ribbonFramesPT(P, side0, endSide) {
  const n = P.length, T = [], S = [];
  for (let i = 0; i < n; i++) T.push(P[Math.min(n - 1, i + 1)].clone().sub(P[Math.max(0, i - 1)]).normalize());
  S.push(side0.clone().addScaledVector(T[0], -side0.dot(T[0])).normalize());
  for (let i = 1; i < n; i++) {
    const sv = S[i - 1].clone();
    rotAxis.crossVectors(T[i - 1], T[i]);
    const s = rotAxis.length();
    if (s > 1e-7) sv.applyAxisAngle(rotAxis.divideScalar(s), Math.atan2(s, T[i - 1].dot(T[i])));
    S.push(sv.addScaledVector(T[i], -sv.dot(T[i])).normalize());
  }

    const d = endSide.clone().addScaledVector(T[n - 1], -endSide.dot(T[n - 1])).normalize();
    const delta = Math.atan2(T[n - 1].dot(new THREE.Vector3().crossVectors(S[n - 1], d)), S[n - 1].dot(d));
    for (let i = 0; i < n; i++) S[i].applyAxisAngle(T[i], delta * i / (n - 1));

// a band surface: for every centre sample, the cross-section runs from -w/2 to +w/2 along the side vector.
// wrap = true: the last sample equals the first and is welded to it (shared vertices, so position and normal are identical).

      const a = prof[Math.max(0, i2 - 1)], b = prof[Math.min(n - 1, i2 + 1)], dr = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dr, dy) || 1;
      return [q[0] - dy / l * gap, q[1] + dr / l * gap];
    });
    const yEnd = prof[ia][1] - 0.17 - depth, yOld = prof[ia][1] - 0.17 - 0.15, ks = Math.min(n - 1, ia + 2);
    const path = [];
    let oldIx = -1;
    for (let q = ks; q >= 0; q--) { path.push(V(Q[q][0], Q[q][1], th)); if (oldIx < 0 && Q[q][1] <= yOld) oldIx = path.length - 1; if (Q[q][1] <= yEnd) break; }
    if (path.length < 4) return null;
    const A = path[0], tang = path[1].clone().sub(path[0]).normalize();
    const land = new THREE.CubicBezierCurve3(base, base.clone().add(new THREE.Vector3(0, -0.12, 0)), A.clone().addScaledVector(tang, -0.14), A);
    const lp = land.getPoints(5), pts = [...lp, ...path.slice(1)];
    const segLen = (a, b) => { let L = 0; for (let q = a; q < b; q++) L += pts[q].distanceTo(pts[q + 1]); return L; };
    const total = segLen(0, pts.length - 1), before = segLen(0, Math.min(pts.length - 1, lp.length - 1 + (oldIx < 0 ? path.length - 1 : oldIx)));
    return { cv: new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.5), f0: total > 0 ? Math.min(0.95, before / total) : 0.5 };
  };

  const computeLayout = (k) => {
    const st = rimStat.layouts[k];
    // ---- leaf poses
    const flipBy = (pose, deg) => {                                                    // swing the leaf outward about its base (axis: the tangent of the rim)
      const th = Math.atan2(pose.base.z, pose.base.x), axis = new THREE.Vector3(-Math.sin(th), 0, Math.cos(th)), rad = new THREE.Vector3(Math.cos(th), 0, Math.sin(th));
      const a = deg * Math.PI / 180, e1 = pose.ex.clone().applyAxisAngle(axis, a), e2 = pose.ex.clone().applyAxisAngle(axis, -a), sgn = e1.dot(rad) >= e2.dot(rad) ? 1 : -1;
      return { ex: pose.ex.clone().applyAxisAngle(axis, sgn * a), ey: pose.ey.clone().applyAxisAngle(axis, sgn * a), ez: pose.ez.clone().applyAxisAngle(axis, sgn * a) };
    };
    const poseOk = (centered, b, ex, ey, size) => {                                    // base, outline, the body of the leaf: 2 mm off the paper and nowhere through it
      const pts = leafPts(centered, b, ex, ey, size);
      for (let q = 0; q < pts.length; q++) {
        if (paperDist(pts[q], k) < 0.02) return false;
        if (q > 0) for (let t = 0.12; t < 0.99; t += 0.12) if (paperDist(pts[0].clone().lerp(pts[q], t), k) < 0.02) return false;
      }
      for (let q = 0; q < pts.length; q++) for (let w = q + 1; w < pts.length; w++) if (segHits(pts[q], pts[w], k)) return false;
      return true;
    };
    const place = (l, centered, tag) => {
      st.leaves++;
      const pose = { base: l.base, ex: l.ex, ey: l.ey, ez: l.ez, size: l.size, removed: false };
      if (k === 0) { st.leafPolys.push(leafPts(centered, pose.base, pose.ex, pose.ey, pose.size)); return pose; }      // the plain mouth keeps every leaf where it is
      const lift = (d) => l.base.clone().add(new THREE.Vector3(0, d, 0));
      let done = false;
      for (let d = 0; d <= 0.1 + 1e-9 && !done; d += 0.02) if (poseOk(centered, lift(d), l.ex, l.ey, l.size)) { pose.base = lift(d); done = true; if (d > 1e-9) { st.raised++; st.maxLift = Math.max(st.maxLift, d); } }
      for (let a = 5; a <= 25 && !done; a += 5) {                                                                      // still touching at the lift cap: turn it outward
        const f = flipBy({ base: l.base, ex: l.ex, ey: l.ey, ez: l.ez }, a);
        if (poseOk(centered, lift(0.1), f.ex, f.ey, l.size)) { Object.assign(pose, f, { base: lift(0.1) }); done = true; st.flipped++; st.maxLift = Math.max(st.maxLift, 0.1); }
      }
      for (const sc of [0.95, 0.9, 0.85, 0.8]) {                                                                       // then smaller (at most 20%)
        if (done) break;
        const f = flipBy({ base: l.base, ex: l.ex, ey: l.ey, ez: l.ez }, 25);
        if (poseOk(centered, lift(0.1), f.ex, f.ey, l.size * sc)) { Object.assign(pose, f, { base: lift(0.1), size: l.size * sc }); done = true; st.shrunk++; st.maxLift = Math.max(st.maxLift, 0.1); }
      }
      if (!done) { pose.removed = true; st.removedLeaves.push(tag); }
      else st.leafPolys.push(leafPts(centered, pose.base, pose.ex, pose.ey, pose.size));
      return pose;
    };
    const P_b = broad.map((l, ix) => place(l, false, 'broad#' + ix)), P_r = round.map((l, ix) => place(l, true, 'round#' + ix));
    const m4 = new THREE.Matrix4(), toMats = (arr, centered) => {
      const out = new Float32Array(arr.length * 16);
      arr.forEach((p, ix) => {
        const sz = p.removed ? 0 : p.size;
        m4.makeBasis(p.ex.clone().multiplyScalar(sz), p.ey.clone().multiplyScalar(sz), p.ez.clone().multiplyScalar(sz));
        m4.setPosition(centered ? p.base.clone().addScaledVector(p.ex, p.size * 0.95) : p.base);
        m4.toArray(out, ix * 16);
      });
      return out;
    };

    // ---- stems
    const parts = [], polys = st.polys;
    for (const g of groups) {
      st.groups++;
      const bp = P_b[broad.indexOf(g.broad)];
      if (bp.removed) { st.trunkRemoved++; continue; }
      let res = null, mode = 'full';
      // 1-2 leaf lengths longer than before, shortened step by step (and a little nearer the wall) until it keeps off the paper
      outer: for (const f of [1, 0.75, 0.5, 0.25, 0]) for (const gap of [GAP, GAP - 0.02]) {
        const t = trunkCurve(bp.base, g.th, 0.15 + g.ext * f, gap, k);
        if (t && !curveBad(t.cv, k, STEM_R)) { res = t; if (f < 1 || gap !== GAP) mode = 'shortened'; break outer; }
      }
      if (!res) fb: for (let depth = 0.12; depth >= -0.3 - 1e-9; depth -= 0.03) for (const gap of [GAP, GAP - 0.03, GAP + 0.04]) { const t = trunkCurve(bp.base, g.th, depth, gap, k); if (t && !curveBad(t.cv, k, STEM_R)) { res = t; mode = 'shortened'; break fb; } }   // shorter still (down to just over the lip), nearer or farther from the wall
      if (!res) { st.trunkRemoved++; continue; }                                         // this group stays leaf-only
      if (mode === 'full') st.stemFull++; else st.stemShortened++;
      parts.push(taperTube(res.cv, res.f0, g.tone)); polys.push(res.cv.getPoints(30)); st.stems++;
      const J = res.cv.getPointAt(0.22 * res.f0);          // where the twigs join: on top of the lip, as before
      for (const rl of g.rounds) {
        const pr = P_r[round.indexOf(rl)];
        if (pr.removed) continue;
        const m = pr.base.clone().lerp(J, 0.5); m.y += 0.04;
        const tw = new THREE.QuadraticBezierCurve3(pr.base, m, J);
        if (curveBad(tw, k, STEM_R)) { st.twigRemoved++; continue; }
        parts.push(taperTube(tw, 1, g.tone)); polys.push(tw.getPoints(30)); st.stems++;
      }
    }
    st.afterBad = polys.filter(pl => pl.some((q, ix) => paperDist(q, k) - STEM_R < 0.04 || (ix > 0 && segHits(pl[ix - 1], q, k)))).length;
    const geo = parts.length ? mergeGeometries(parts, false) : new THREE.BufferGeometry();
    parts.forEach(gm => gm.dispose());
    return { geo, broadM: toMats(P_b, false), roundM: toMats(P_r, true) };
  };

  const layouts = [computeLayout(0), null];
  const ensureLayout1 = () => { if (!layouts[1]) layouts[1] = computeLayout(1); };
  // the frilled-mouth layout (粉荷葉) is computed a moment after the first picture is up (or on demand if that style is picked first)
  setTimeout(() => (window.requestIdleCallback || setTimeout)(ensureLayout1), 2500);

  const stemMesh = new THREE.Mesh(layouts[0].geo, new THREE.MeshStandardMaterial({ color: '#ffffff', vertexColors: true, roughness: 0.6 }));
  stemMesh.userData.cat = 'eucalyptus';
  bouquet.add(stemMesh);

  const col = new THREE.Color();
  const make = (geo, list, mat, hsl, mats) => {
    const im = new THREE.InstancedMesh(geo, mat, list.length);
    im.instanceMatrix.array.set(mats);
    list.forEach((l, ix) => im.setColorAt(ix, col.setHSL(rnd(hsl[0], hsl[1]), rnd(hsl[2], hsl[3]), rnd(hsl[4], hsl[5]))));
    im.castShadow = false;
    im.userData.cat = 'eucalyptus';
    bouquet.add(im);
    return im;
  };
  const imBroad = make(broadLeafGeometry(), broad, new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.55, side: THREE.DoubleSide }),
    [0.285, 0.365, 0.24, 0.41, 0.2, 0.36], layouts[0].broadM);
  const imRound = make(cupLeafGeometry(), round, new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.6, side: THREE.DoubleSide }),
    [0.325, 0.405, 0.11, 0.23, 0.52, 0.71], layouts[0].roundM);
  let curLayout = 0;
  applyRimLayout = (k) => {
    if (k === 1) ensureLayout1();
    if (k === curLayout || !layouts[k]) return;
    stemMesh.geometry = layouts[k].geo;
    imBroad.instanceMatrix.array.set(layouts[k].broadM); imBroad.instanceMatrix.needsUpdate = true;
    imRound.instanceMatrix.array.set(layouts[k].roundM); imRound.instanceMatrix.needsUpdate = true;
    curLayout = k;

}

await frame();
/* ---------- wrap styles + 0.35 s fade ---------- */
const WRAP_FOR = { '粉橘': '奶油牛皮', '象牙杏': '奶油牛皮', '正紅': '霧黑', '粉藍': '粉荷葉', '黑': '銀灰紫' };
const wrapButtons = {};
let userPickedWrap = false;

const wrapKeysC = ['inner', 'mid', 'midPlain', 'outer', 'tulle', 'ribbon'];
const wrapKeysN = ['outerOp', 'tulleOp', 'ribbonOp', 'ruffle', 'ribbonRough', 'ribbonSheen', 'ribbonSpec', 'sheer', 'ribbonMetal'];
const mkWrap = () => { const o = { outerOp: 1, tulleOp: 0.45, ribbonOp: 1, ruffle: 0, ribbonRough: 0.3, ribbonSheen: 1, ribbonSpec: 0.85, sheer: 0, ribbonMetal: 0 }; wrapKeysC.forEach(k => o[k] = new THREE.Color()); return o; };
const wrapCur = mkWrap(), wrapFrom = mkWrap(), wrapTo = mkWrap();
const wrapFade = { active: false, t0: 0 };
const copyWrap = (a, b) => { wrapKeysC.forEach(k => a[k].copy(b[k])); wrapKeysN.forEach(k => a[k] = b[k]); };

function wrapTarget(st, out) {
  const comp = 1 / Math.pow(st.bg / 255, 2.2);                           // compensates the print texture's base level
  const printed = st.text || st.border;
  out.inner.set(st.inner);
  out.mid.set(st.mid); if (printed) out.mid.multiplyScalar(comp);
  out.midPlain.set(st.mid); if (st.border) out.midPlain.multiplyScalar(comp);
  out.outer.set(st.outer); out.tulle.set(st.tulle); out.ribbon.set(st.ribbon);
  out.outerOp = st.outerOp; out.tulleOp = st.tulleOp; out.ribbonOp = st.ribbonOp; out.ruffle = st.ruffle;
  out.ribbonRough = st.ribbonRough; out.ribbonSheen = st.ribbonSheen; out.ribbonSpec = st.ribbonSpec; out.sheer = st.sheer || 0; out.ribbonMetal = st.ribbonMetal || 0;
}
function setTransparent(mat, op) {
  const tr = op < 0.999;
  if (mat.transparent !== tr) { mat.transparent = tr; mat.depthWrite = !tr; mat.needsUpdate = true; }
  mat.opacity = op;
}
const WHITE = new THREE.Color('#ffffff'), tmpSheen = new THREE.Color();
function applyWrap(v) {
  layerMats.inner.color.copy(v.inner);
  layerMats.midPrint.color.copy(v.mid);
  layerMats.midPlain.color.copy(v.midPlain);
  layerMats.outer.color.copy(v.outer);
  setTransparent(layerMats.outer, v.outerOp);
  tulleMat.color.copy(v.tulle); tulleMat.opacity = v.tulleOp;
  // sheen colour = a lighter version of the base colour; the sheer (gauze) style gives loops and tails a whiter, softer finish,
  // while the knot and the band stay satin in every style
  const sheenSat = tmpSheen.copy(v.ribbon).lerp(WHITE, lerp(0.45, 0.65, Math.min(1, v.ribbonMetal / 0.2))), sh = v.sheer;   // the gold ribbon gets a slightly lighter sheen
  for (const m of ribbonAll) {
    const sheerPart = m === ribbonMats.loops || m === ribbonMats.tails, k = sheerPart ? 0 : sh;     // k: how far this part is pulled back to satin
    m.color.copy(v.ribbon); m.metalness = v.ribbonMetal;
    m.roughness = lerp(v.ribbonRough, 0.3, k); m.sheen = lerp(v.ribbonSheen, 1, k); m.specularIntensity = lerp(v.ribbonSpec, 0.85, k);
    m.sheenColor.copy(sheenSat).lerp(WHITE, sheerPart ? sh * 0.7 : 0);
    m.anisotropy = sheerPart ? lerp(0.8, 0.12, sh) : 0.8;
    const nm = m === ribbonMats.knot ? knotNormal : sheerPart && sh > 0.5 ? gauzeNormal : weaveNormal;
    const ns = sheerPart ? lerp(0.2, 0.35, sh) : 0.2;
    m.normalScale.set(ns, ns);
    const am = sheerPart && v.ribbonOp < 0.999 ? hemMask : null;
    if (m.normalMap !== nm || m.alphaMap !== am) { m.normalMap = nm; m.alphaMap = am; m.needsUpdate = true; }
  }
  // only the loops and tails are see-through (gauze ribbon); band and knot stay opaque. depthWrite stays on for all.
  for (const m of [ribbonMats.loops, ribbonMats.tails]) {
    const tr = v.ribbonOp < 0.999;
    if (m.transparent !== tr) { m.transparent = tr; m.needsUpdate = true; }
    m.opacity = v.ribbonOp;
  }
  ruffleU.value = v.ruffle;
}
function setWrapStyle(name, instant) {
  const st = WRAP_STYLES[name];
  const tex = getPrintTexture(st);
  const mp = (st.text || st.border) ? tex : null, mq = st.border ? tex : null;     // prints swap at the start; colours fade
  if (layerMats.midPrint.map !== mp) { layerMats.midPrint.map = mp; layerMats.midPrint.needsUpdate = true; }
  if (layerMats.midPlain.map !== mq) { layerMats.midPlain.map = mq; layerMats.midPlain.needsUpdate = true; }
  copyWrap(wrapFrom, wrapCur);
  wrapTarget(st, wrapTo);
  if (instant) { copyWrap(wrapCur, wrapTo); applyWrap(wrapCur); wrapFade.active = false; applyRimLayout(st.ruffle > 0.5 ? 1 : 0); }
  else { wrapFade.t0 = performance.now(); wrapFade.active = true; }
  for (const k in wrapButtons) wrapButtons[k].classList.toggle('active', k === name);
}
function stepWrap(now) {
  if (!wrapFade.active) return;
  const k = Math.min(1, (now - wrapFade.t0) / FADE_MS);
  const e = easeInOut(k);
  wrapKeysC.forEach(c => wrapCur[c].copy(wrapFrom[c]).lerp(wrapTo[c], e));
  wrapKeysN.forEach(n => wrapCur[n] = lerp(wrapFrom[n], wrapTo[n], e));
  applyWrap(wrapCur);
  if (k >= 1) { wrapFade.active = false; applyRimLayout(wrapTo.ruffle > 0.5 ? 1 : 0); }
}

/* ---------- gentle wind: the whole bouquet sways about the grip ---------- */
const swayEuler = new THREE.Euler();
function updateSway(t) {
  swayEuler.set(Math.sin(t * 0.53 + 1) * 0.010, 0, Math.sin(t * 0.71) * 0.014);
  bouquet.rotation.copy(swayEuler);
  bouquet.position.copy(GRIP).sub(GRIP.clone().applyEuler(swayEuler));
}

/* ============ LOD: nearest roses keep full detail ============ */
const tmpV = new THREE.Vector3();
function updateLOD() {
  const ranked = roses.map(r => ({ r, d: tmpV.copy(r.origin).distanceTo(camera.position) })).sort((a, b) => a.d - b.d);
  const nMid = Math.ceil(Math.max(0, roses.length - HIGH_ROSES) * 0.45);
  let builds = 0;
  ranked.forEach((o, i) => {
    const l = i < HIGH_ROSES ? 0 : i < HIGH_ROSES + nMid ? 1 : 2;
    if (LITE && !o.r.geos[l] && o.r.level !== l && builds++ >= 1) return;       // phones: spread rebuilds over several updates
    o.r.setLevel(l);
  });
}
// first build: a few roses per frame so the loading screen keeps painting
async function buildRosesBatched() {
  const ranked = roses.map(r => ({ r, d: tmpV.copy(r.origin).distanceTo(camera.position) })).sort((a, b) => a.d - b.d);
  const nMid = Math.ceil(Math.max(0, roses.length - HIGH_ROSES) * 0.45);
  for (let i = 0; i < ranked.length; i++) {
    ranked[i].r.setLevel(i < HIGH_ROSES ? 0 : i < HIGH_ROSES + nMid ? 1 : 2);
    if (i % 2 === 1) await frame();
  }
}

/* ============ colour buttons ============ */
// ONE fade drives everything: rose vertex colours (GPU mix), sheen/roughness/env and baby's breath
const fade = { active: false, t0: 0 };
const fadeCol = new THREE.Color(), instCol = new THREE.Color(), flowerFrom = new THREE.Color(), flowerTo = new THREE.Color();
const sheenFrom = new THREE.Color(), sheenTo = new THREE.Color();
let roughFrom = 0.55, roughTo = 0.55, envFrom = ENV_INTENSITY, envTo = ENV_INTENSITY, firstPalette = true;

function applyFlowerColor(c) {
  for (let i = 0; i < flowerJitter.length; i++) {
    flowerMesh.setColorAt(i, instCol.setRGB(c.r * flowerJitter[i], c.g * flowerJitter[i], c.b * flowerJitter[i]));
  }
  flowerMesh.instanceColor.needsUpdate = true;
}
const easeInOut = (k) => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;

// one progress value e for every colour that changes; called from the render loop every frame
function stepFade(now) {
  if (!fade.active) return;
  const k = Math.min(1, (now - fade.t0) / FADE_MS);
  const e = easeInOut(k);
  mixUniform.value = e;
  petalMaterial.sheenColor.copy(sheenFrom).lerp(sheenTo, e);
  petalMaterial.roughness = lerp(roughFrom, roughTo, e);
  petalMaterial.envMapIntensity = lerp(envFrom, envTo, e);
  fadeCol.copy(flowerFrom).lerp(flowerTo, e);
  applyFlowerColor(fadeCol);
  if (k >= 1) fade.active = false;
}

const bar = document.getElementById('colors');
const buttons = {};
function setPalette(name) {
  currentPal = PALETTES[name];
  const first = firstPalette;
  firstPalette = false;
  if (!userPickedWrap) setWrapStyle(WRAP_FOR[name], first);   // pair a wrap with the flower colour until the user picks one
  // restart from whatever is on screen right now (also when clicked mid-fade): no flash
  roses.forEach(r => r.retarget(mixUniform.value, first));
  sheenFrom.copy(petalMaterial.sheenColor); sheenTo.set(currentPal.sheen);
  roughFrom = petalMaterial.roughness; roughTo = currentPal.roughness ?? 0.55;
  envFrom = petalMaterial.envMapIntensity; envTo = currentPal.env ?? ENV_INTENSITY;
  flowerFrom.copy(first ? fadeCol.set(currentPal.breath) : fadeCol);
  flowerTo.set(currentPal.breath);
  if (first) {
    mixUniform.value = 1;
    petalMaterial.sheenColor.copy(sheenTo); petalMaterial.roughness = roughTo; petalMaterial.envMapIntensity = envTo;
    fadeCol.copy(flowerTo); applyFlowerColor(fadeCol);
    fade.active = false;
  } else {
    mixUniform.value = 0;
    fade.t0 = performance.now();
    fade.active = true;
  }
  for (const k in buttons) buttons[k].classList.toggle('active', k === name);
}
for (const name in PALETTES) {
  const b = document.createElement('button');
  b.textContent = name;
  b.onclick = () => setPalette(name);
  bar.appendChild(b);
  buttons[name] = b;
}
const sep = document.createElement('span');
sep.style.width = '12px';
bar.appendChild(sep);
for (const name in WRAP_STYLES) {
  const b = document.createElement('button');
  b.textContent = name;
  b.onclick = () => { userPickedWrap = true; setWrapStyle(name, false); };
  bar.appendChild(b);
  wrapButtons[name] = b;
}
setPalette('粉橘');
await buildRosesBatched();

/* ============ loop + FPS ============ */
const hud = document.getElementById('hud');
if (new URLSearchParams(location.search).get('debug') === '1') hud.style.display = 'block';
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
let frames = 0, last = performance.now(), tick = 0;
const loadSec = ((performance.now() - T_START) / 1000).toFixed(1);
renderer.setAnimationLoop(() => {
  controls.update();
  const now = performance.now();
  timeU.value = now / 1000;
  stepFade(now);
  stepWrap(now);
  tick++;
  if (!LITE || (tick & 1) === 0) updateSway(now / 1000);
  if (tick % 8 === 0 && !(LITE && interacting)) updateLOD();
  renderer.render(scene, camera);
  frames++;
  if (now - last >= 1000) {
    if (hud.style.display === 'block') hud.textContent = `FPS ${Math.round(frames * 1000 / (now - last))}\n畫質 ${LITE ? '精簡版' : '完整版'} · 載入 ${loadSec} 秒\n玫瑰 ${roses.length} 朵 · 三角形 ${renderer.info.render.triangles.toLocaleString()}\nDraw calls ${renderer.info.render.calls}`;
    frames = 0; last = now;
  }
});
// done: fade the loading screen out
{
  const el = document.getElementById('loading');
  el.style.opacity = '0';
  setTimeout(() => el.remove(), 700);
}
</script>
